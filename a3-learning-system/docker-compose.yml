version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: a3-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: a3_learning
      MYSQL_USER: a3_user
      MYSQL_PASSWORD: a3_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/alembic/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: a3-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: a3-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: a3-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_data_local:/chroma/chroma

volumes:
  mysql_data:
  minio_data:
  chroma_data:
